<html lang="en">

<meta name="robots" content="noindex">

<style>html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>UCEED Mock Test Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: exam-console. Paper list on arrival; inside a test, question sheet on the left and the official-style question palette on the right. EduAakashaa navy + orange on cream. */
:root{
  --bg:#FBF7EE; --surface:#FFFDF7; --sunk:#F3ECDC; --ink:#0E1B3D; --muted:#5A6278; --line:#E6DCC4;
  --navy:#0E3A8A; --navy-ink:#0A2560; --on-navy:#FFFFFF; --link:#0E3A8A;
  --accent:#FF6B0A; --accent-ink:#B84800; --accent-soft:#FFE6D3;
  --ok:#1F8B5C; --ok-soft:#DDF1E6; --bad:#C23A3A; --bad-soft:#F8E0DE; --part:#B07800; --part-soft:#F7EBCB;
  --mark:#5B3FA8; --mark-soft:#E7E0F6; --idle:#D9D2C0;
  --paper:#FFFFFF;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1230; --surface:#111B3F; --sunk:#0D1636; --ink:#EEF1F8; --muted:#A4ADC6; --line:#25325C;
  --navy:#2E5CC0; --navy-ink:#C9D7FA; --on-navy:#FFFFFF; --link:#9DB8F5;
  --accent:#FF8A3D; --accent-ink:#FFB27D; --accent-soft:#3A2416;
  --ok:#4CC28C; --ok-soft:#123A2B; --bad:#F07A72; --bad-soft:#3E1C22; --part:#E8B64A; --part-soft:#3A2F12;
  --mark:#A68CF0; --mark-soft:#2A2250; --idle:#3A4670; --paper:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1230; --surface:#111B3F; --sunk:#0D1636; --ink:#EEF1F8; --muted:#A4ADC6; --line:#25325C;
  --navy:#2E5CC0; --navy-ink:#C9D7FA; --on-navy:#FFFFFF; --link:#9DB8F5;
  --accent:#FF8A3D; --accent-ink:#FFB27D; --accent-soft:#3A2416;
  --ok:#4CC28C; --ok-soft:#123A2B; --bad:#F07A72; --bad-soft:#3E1C22; --part:#E8B64A; --part-soft:#3A2F12;
  --mark:#A68CF0; --mark-soft:#2A2250; --idle:#3A4670; --paper:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1 em,h2 em{font-style:italic;font-weight:600;color:var(--accent)}

/* masthead */
.mast{border-bottom:1px solid var(--line);background:var(--surface)}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:650;font-size:19px;color:var(--navy-ink);background:none;border:0;padding:0}
.brand b{color:var(--accent);font-weight:650}
.brand svg{flex:none}
.mast .tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--navy);color:var(--on-navy)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.hot{background:var(--accent);color:#1B0D00}
.btn.hot:hover{filter:brightness(1.05)}
.btn.sec{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--muted)}
.btn.ghost{background:transparent;color:var(--link);padding-inline:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* home */
.hero{padding-block:40px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin-top:10px}
.hero p{color:var(--muted);max-width:56ch;margin:14px 0 0}
.member{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.member label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.member input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.member small{display:block;color:var(--muted);margin-top:8px;font-size:12.5px}
.resume{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:var(--r);padding:14px 16px;margin-bottom:22px}
.resume p{margin:0}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:28px}
.modes div{background:var(--surface);padding:16px 18px}
.modes h3{font-family:var(--f-body);font-size:15px;font-weight:700;margin-bottom:4px}
.modes p{margin:0;color:var(--muted);font-size:13.5px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.secthead h2{font-size:26px}
.secthead span{color:var(--muted);font-size:13.5px}
.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:40px}
.yr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.yr .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.yr .y{font-family:var(--f-display);font-size:38px;font-weight:650;line-height:1;color:var(--navy-ink)}
.yr .fmt{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.nat{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.chip.msq{color:var(--mark);border-color:color-mix(in srgb,var(--mark) 35%,transparent)}
.chip.mcq{color:var(--link);border-color:color-mix(in srgb,var(--link) 35%,transparent)}
.best{font-size:13px;color:var(--muted)}
.best b{color:var(--ink);font-family:var(--f-mono)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.yr .acts{display:flex;gap:8px;margin-top:auto}
.yr .acts .btn{flex:1;padding-inline:10px}
.foot{border-top:1px solid var(--line);padding-block:22px 34px;color:var(--muted);font-size:12.5px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}
.foot p{margin:0 0 6px}
.foot .contact{font-family:var(--f-mono);font-size:12px;user-select:all}

/* test */
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.tbar .ttl{font-weight:700;font-size:15px;min-width:0}
.tbar .ttl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:8px;padding:3px;margin-left:auto}
.tabs button{border:0;background:transparent;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:7px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.palbtn{display:none}
.btn.exit{padding:8px 6px;margin-left:-6px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;padding-block:20px 40px;align-items:start}
.qpane{min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead h2{font-size:26px;margin-right:4px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-x:auto}
.sheet img{display:block;margin:0 auto;height:auto;max-width:100%}
.ansbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ansbox .lab{font-size:13px;color:var(--muted);margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:14px 0;font-family:var(--f-display);font-size:24px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px}
.opt .box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:50%;display:inline-block;position:relative;flex:none}
.opt.multi .box{border-radius:4px}
.opt[aria-checked="true"]{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 12%,var(--bg))}
.opt[aria-checked="true"] .box{border-color:var(--navy);background:var(--navy)}
.opt[aria-checked="true"] .box::after{content:"";position:absolute;inset:4px;background:var(--on-navy);border-radius:inherit}
.opt.multi[aria-checked="true"] .box::after{inset:auto;left:5px;top:1px;width:5px;height:10px;background:none;border:solid var(--on-navy);border-width:0 2px 2px 0;transform:rotate(45deg);border-radius:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.natrow{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
.natrow input{width:100%;font-family:var(--f-mono);font-size:22px;padding:12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:300px}
.pad button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:9px 0;font-family:var(--f-mono);font-size:15px;font-weight:600}
.pad button:hover{border-color:var(--muted)}
.pad .wide{grid-column:span 2}
.qacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.qacts .sp{flex:1}
.fb{margin-top:16px;border-radius:var(--r);padding:14px 16px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.part{background:var(--part-soft);border-color:var(--part)}
.fb.blank{background:var(--sunk)}
.fb .v{font-weight:700;font-size:16px}
.fb .k{font-family:var(--f-mono);font-size:13px;margin-top:2px}

/* explanation */
.exp{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.exp .h{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
.exp ol{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:7px}
.exp li{counter-increment:s;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;max-width:72ch}
.exp li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;font-weight:600;width:22px;height:22px;border-radius:6px;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;justify-content:center;margin-top:1px}
.exp p{margin:0;max-width:72ch}
.viz{margin:14px 0 0;background:var(--paper);border-radius:8px;padding:10px;border:1px solid var(--line);max-width:520px;overflow-x:auto}
.viz svg{display:block;width:100%;height:auto;min-width:260px}
.trap{margin-top:12px;background:var(--bad-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.trap b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);margin-right:8px}

/* palette */
.pal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 96px);overflow:auto}
.pal h3{font-family:var(--f-body);font-size:14px;font-weight:700;margin-bottom:10px}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;margin-bottom:14px}
.counts span{display:flex;align-items:center;gap:7px;color:var(--muted)}
.counts b{color:var(--ink);font-family:var(--f-mono)}
.psec{margin-top:12px}
.psec .ph{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pq{position:relative;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.pq.vis{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pq.ans{background:var(--ok);border-color:var(--ok);color:#fff}
.pq.mk{background:var(--mark);border-color:var(--mark);color:#fff;border-radius:50%}
.pq.mkans::after{content:"";position:absolute;right:2px;bottom:2px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:1.5px solid #fff}
.pq.pr-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pq.pr-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.pq.pr-part{background:var(--part);border-color:var(--part);color:#fff}
.pq.cur{outline:2px solid var(--accent);outline-offset:1px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);background:var(--bg);flex:none}
.sw.vis{background:var(--bad-soft);border-color:var(--bad)}.sw.ans{background:var(--ok);border-color:var(--ok)}.sw.mk{background:var(--mark);border-color:var(--mark);border-radius:50%}.sw.part{background:var(--part);border-color:var(--part)}.sw.bad{background:var(--bad);border-color:var(--bad)}
.pal .btn{width:100%;margin-top:16px}
.scrim{display:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,12,32,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:440px;width:100%}
.modal h3{font-size:22px;margin-bottom:8px}
.modal p{color:var(--muted);margin:0 0 6px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* results */
.rhero{padding-block:30px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.score{font-family:var(--f-display);font-size:clamp(48px,8vw,80px);font-weight:650;line-height:1;color:var(--navy-ink)}
.score small{font-size:.38em;color:var(--muted);font-weight:500}
.rmeta{color:var(--muted);margin-top:10px}
.rsecs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:28px}
.rsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rsec .n{font-family:var(--f-mono);font-size:22px;font-weight:600}
.rsec .n small{font-size:13px;color:var(--muted);font-weight:400}
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:10px 0 8px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.rlist{display:grid;gap:8px;margin-bottom:40px}
.ritem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ritem summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:96px 64px minmax(0,1fr) minmax(0,1fr) 70px;gap:10px;align-items:center;padding:12px 14px;font-size:14px}
.ritem summary::-webkit-details-marker{display:none}
.ritem .qn{font-family:var(--f-mono);font-weight:600}
.ritem .lbl{font-size:11px;color:var(--muted);display:block;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.ritem .val{font-family:var(--f-mono);min-width:0;overflow-wrap:anywhere}
.ritem .mk{font-family:var(--f-mono);font-weight:600;text-align:right}
.mk.pos{color:var(--ok)}.mk.neg{color:var(--bad)}.mk.zero{color:var(--muted)}.mk.part{color:var(--part)}
.ritem .body{padding:0 14px 16px}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* original questions, pattern analysis, topic scores */
.sheet.orig{color:#1B1B1B;font-size:16px;line-height:1.55}
.sheet.orig .stem{margin:0 0 12px;max-width:70ch}
.ofig{margin:0 0 12px}
.ofig svg,.oi svg{max-width:100%;height:auto;display:block}
.ofig svg{margin:0 auto}
.olist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.oi{display:flex;gap:10px;align-items:flex-start;border:1px solid #DDD6C6;border-radius:8px;padding:9px 11px;min-width:0;background:#FFFFFF}
.oi b{font-family:var(--f-display);font-size:17px;color:#0A2560;flex:none;line-height:1.3}
.oi>div{min-width:0;flex:1}
.olist.og .oi{flex-direction:column;align-items:stretch}
.olist.og .oi>div{display:flex;justify-content:center}
.pattern{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;margin-bottom:22px;align-items:start}
.heatwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.heat{border-collapse:separate;border-spacing:3px;font-size:12.5px;width:100%;min-width:560px}
.heat th{font-family:var(--f-mono);font-weight:600;font-size:11.5px;color:var(--muted);padding:4px 2px;text-align:center}
.heat th.rowh{text-align:left;font-family:var(--f-body);font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap;padding-right:8px}

<body>
<div id="app"></div>

<script>
(function(){
const YEARS=[
 {y:2026,n:57,mins:120,max:200,secs:[['NAT',14,'+4'],['MSQ',15,'partial, −1'],['MCQ',28,'+3 / −0.71']]},
 {y:2025,n:57,mins:120,max:200,secs:[['NAT',14,'+4'],['MSQ',15,'partial, −1'],['MCQ',28,'+3 / −0.71']]},
 {y:2024,n:57,mins:120,max:200,secs:[['NAT',14,'+4'],['MSQ',15,'partial, −1'],['MCQ',28,'+3 / −0.71']]},
 {y:2023,n:68,mins:150,max:240,secs:[['NAT',18,'+4'],['MSQ',18,'partial, −1'],['MCQ',32,'+3 / −0.71']]},
 {y:2022,n:68,mins:150,max:240,secs:[['NAT',18,'+4'],['MSQ',18,'partial, −1'],['MCQ',32,'+3 / −0.71']]},
 {y:2021,n:68,mins:150,max:240,secs:[['NAT',18,'+4'],['MSQ',18,'+4 / −0.19'],['MCQ',32,'+3 / −0.71']]},
 {y:2020,n:68,mins:150,max:240,secs:[['NAT',18,'+4'],['MSQ',18,'+4 / −0.19'],['MCQ',32,'+3 / −0.71']]},
 {y:2019,n:85,mins:180,max:300,secs:[['NAT',20,'+3'],['MSQ',20,'+3 / −0.19'],['MCQ',45,'+4 / −1.32']]},
 {y:2018,n:85,mins:180,max:300,secs:[['NAT',20,'+4'],['MSQ',25,'+4, no negative'],['MCQ',40,'+3 / −1']]}
];
const MOCKS=[1,2,3,4,5].map(i=>({y:'M'+i,n:57,mins:120,max:200,mock:true,secs:[['NAT',14,'+4'],['MSQ',15,'partial, −1'],['MCQ',28,'+3 / −0.71']]}));
const ALL=[...YEARS,...MOCKS];
const CATS={OBS:'Observation & counting',NUM:'Numbers & logic',SPA:'3D & spatial',PAT:'Patterns & transformations',SCI:'Everyday science',VIS:'Visual design',CUL:'Art, culture & language'};
const HEAT={"2018":{"OBS":0,"NUM":24,"SPA":12,"PAT":0,"SCI":0,"VIS":23,"CUL":26},"2019":{"OBS":11,"NUM":21,"SPA":15,"PAT":23,"SCI":0,"VIS":0,"CUL":15},"2020":{"OBS":14,"NUM":20,"SPA":11,"PAT":16,"SCI":7,"VIS":0,"CUL":0},"2021":{"OBS":13,"NUM":25,"SPA":10,"PAT":13,"SCI":7,"VIS":0,"CUL":0},"2022":{"OBS":20,"NUM":19,"SPA":8,"PAT":16,"SCI":5,"VIS":0,"CUL":0},"2023":{"OBS":10,"NUM":9,"SPA":14,"PAT":17,"SCI":10,"VIS":8,"CUL":0},"2024":{"OBS":5,"NUM":10,"SPA":9,"PAT":18,"SCI":7,"VIS":8,"CUL":0},"2025":{"OBS":10,"NUM":13,"SPA":7,"PAT":8,"SCI":7,"VIS":0,"CUL":12},"2026":{"OBS":11,"NUM":6,"SPA":5,"PAT":7,"SCI":11,"VIS":8,"CUL":9},"Mocks":{"OBS":8,"NUM":10,"SPA":8,"PAT":10,"SCI":8,"VIS":6,"CUL":7}};
const ttl=y=>String(y).startsWith('M')?`EduAakashaa Mock ${String(y).slice(1)}`:`UCEED ${y}`;
const short=y=>String(y).startsWith('M')?`Mock ${String(y).slice(1)}`:`UCEED ${y}`;
const CONF=[['G','Guess','var(--muted)'],['L','Low','var(--part)'],['M','Medium','var(--link)'],['H','High','var(--ok)']];
const CNAME={G:'Guess',L:'Low',M:'Medium',H:'High'};
const CFG=Object.assign({dataPath:'data/',memberName:'',memberId:'',resultsEndpoint:''},window.EA_CONFIG||{});
const KEY='ea-uceed-mock-v1'+(CFG.memberId?'-'+CFG.memberId:'');
const S={view:'home',name:'',best:{},att:null,data:{},rfilter:'all',palOpen:false,modal:null};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');S.name=d.name||CFG.memberName||'';S.best=d.best||{};S.att=d.att||null;}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({name:S.name,best:S.best,att:S.att}));}catch(e){}}
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=x=>{const v=Math.round(x*100)/100;return (Object.is(v,-0)?0:v).toString();};
const sign=x=>x>0?'+'+fmt(x):fmt(x);
const hm=m=>m%60?`${Math.floor(m/60)} h ${m%60} min`:`${m/60} h`;
const clock=ms=>{ms=Math.max(0,ms);const t=Math.round(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;};
const meta=y=>ALL.find(o=>String(o.y)===String(y));
const LOGO='<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="6" fill="var(--navy)"/><path d="M8 19 L14 7 L20 19" fill="none" stroke="#FF6B0A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 14.6 H17.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';

/* ---------- scoring ---------- */
function secOf(D,n){return D.sections.find(s=>n>=s.lo&&n<=s.hi);}
function evaluate(D,q,a){
  const s=secOf(D,q.n);
  if(q.acc.bonus) return {st:'bonus',m:s.right};
  if(a==null||a==='') return {st:'blank',m:0};
  if(q.t==='NAT'){
    const v=parseFloat(String(a).replace('−','-'));
    if(isNaN(v)) return {st:'wrong',m:s.wrong};
    const ok=q.acc.ranges.some(([lo,hi])=>v>=lo-1e-9&&v<=hi+1e-9);
    return ok?{st:'right',m:s.right}:{st:'wrong',m:s.wrong};
  }
  if(q.t==='MCQ') return q.acc.sets.includes(a)?{st:'right',m:s.right}:{st:'wrong',m:s.wrong};
  // MSQ
  if(q.acc.sets.includes(a)) return {st:'right',m:s.right};
  if(!s.partial) return {st:'wrong',m:s.wrong};
  let best=null;
  for(const set of q.acc.sets){
    const allIn=[...a].every(c=>set.includes(c));
    const r=allIn?{st:'part',m:a.length}:{st:'wrong',m:s.wrong};
    if(!best||r.m>best.m) best=r;
  }
  return best;
}
function results(D,ans){
  const per={},secs=D.sections.map(s=>({type:s.type,lo:s.lo,hi:s.hi,score:0,max:0,right:0,part:0,wrong:0,blank:0}));
  let total=0;
  for(const q of D.qs){
    const r=evaluate(D,q,ans[q.n]);per[q.n]=r;total+=r.m;
    const sc=secs.find(s=>q.n>=s.lo&&q.n<=s.hi);sc.score+=r.m;sc.max+=secOf(D,q.n).right;
    if(r.st==='right'||r.st==='bonus')sc.right++;else if(r.st==='part')sc.part++;else if(r.st==='wrong')sc.wrong++;else sc.blank++;
  }
  return {per,secs,total};
}
function showAns(q,a){if(a==null||a==='')return '—';return q.t==='NAT'?String(a):[...a].join(', ');}
function officialAns(q){return q.acc.bonus?'Full marks to all':q.disp;}

/* ---------- data ---------- */
async function getData(y){
  if(S.data[y]) return S.data[y];
  const r=await fetch(`${CFG.dataPath}${y}.json`,{credentials:'same-origin'});
  if(!r.ok) throw new Error('load');
  const d=await r.json();S.data[y]=d;return d;
}

/* ---------- views ---------- */
function mast(){
  return `<header class="mast"><div class="wrap"><button class="brand" data-act="home" aria-label="All papers">${LOGO}<span>Edu<b>Aakashaa</b></span></button><span class="tag">UCEED mock tests · Members</span></div></header>`;
}

  return `<footer class="wrap foot"><div><p>Questions are reproduced from the official UCEED question papers (2018 to 2026) published by IIT Bombay. Answers follow IIT Bombay's final answer keys. Explanations, diagrams and common mistakes are written by EduAakashaa with AI assistance and checked against the official keys; please tell us if you spot an error.</p><p>The five EduAakashaa practice papers are original questions written for practice, following the official topic mix and marking; they are not IIT Bombay papers. Their answers are worked out by computation or checked against standard references.</p><p>Part A only. Part B drawing and design questions are covered in the EduAakashaa solved-paper guides. Scores are saved only in this browser.</p></div><div><p>EduAakashaa, Coimbatore</p><p class="contact">+91 80157 22706<br>info@eduaakashaa.com<br>www.eduaakashaa.com</p></div></footer>`;
}
function renderHome(){
  S.view='home';
  const a=S.att;
  let resume='';
  if(a&&!a.done){
    const left=a.mode==='mock'?` · ${clock(a.endAt-Date.now())} left`:'';
    resume=`<div class="resume"><p><b>Test in progress:</b> ${ttl(a.y)} ${a.mode==='mock'?'timed mock':'practice'}${left}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-act="discard">Discard</button><button class="btn hot" data-act="resume">Resume</button></div></div>`;
  }
  const card=o=>{
    const b=S.best[o.y];
    const pct=b?Math.max(0,Math.min(100,b.score/o.max*100)):0;
    return `<article class="yr"><div class="top"><span class="y">${o.mock?'Mock '+o.y.slice(1):o.y}</span><span class="fmt">${o.n} questions<br>${hm(o.mins)} · ${o.max} marks</span></div>

    <div><div class="best">${b?`Best mock: <b>${fmt(b.score)} / ${o.max}</b>`:'No timed mock yet'}</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
    <div class="acts"><button class="btn pri" data-act="start" data-y="${o.y}" data-mode="mock">Timed mock</button><button class="btn sec" data-act="start" data-y="${o.y}" data-mode="practice">Practise</button></div></article>`;
  };
  const cards=YEARS.map(card).join(''), mcards=MOCKS.map(card).join('');
  const cols=['2018','2019','2020','2021','2022','2023','2024','2025','2026','Mocks'];
  const heat=`<table class="heat"><thead><tr><th></th>${cols.map(c=>`<th${c==='Mocks'?' class="mockcol"':''}>${c==='Mocks'?'New':c.slice(2)==c?c:"'"+c.slice(2)}</th>`).join('')}</tr></thead><tbody>${Object.keys(CATS).map(k=>`<tr><th class="rowh" scope="row">${CATS[k]}</th>${cols.map(c=>{const tot=Object.values(HEAT[c]).reduce((a,b)=>a+b,0),v=HEAT[c][k],p=Math.round(v/tot*100);
      return v?`<td${c==='Mocks'?' class="mockcol"':''} style="background:color-mix(in srgb,var(--navy) ${Math.min(90,p*2.6)}%,var(--surface));color:${p*2.6>48?'var(--on-navy)':'var(--ink)'}" title="${v} of ${tot} questions">${p}%</td>`:`<td class="z${c==='Mocks'?' mockcol':''}">–</td>`;}).join('')}</tr>`).join('')}</tbody></table>`;
  app.innerHTML=mast()+`<main class="wrap">
  <section class="hero"><div><div class="eyebrow">UCEED Part A · 613 real questions + 285 new</div><h1>Sit every UCEED paper <em>like the real thing.</em></h1><p>Nine official papers from 2018 to 2026 and five new practice papers, with the real timer, the real marking scheme and the question palette you will see on exam day. After each test, every question opens with the official answer and a step-by-step explanation.</p></div>
  <div class="member"><label for="mname">Your name</label><input id="mname" autocomplete="name" placeholder="e.g. Aisha Rahman" value="${esc(S.name)}"><small>Shown on your score card. Saved only on this device.</small></div></section>
  ${resume}
  <div class="modes"><div><h3>Timed mock</h3><p>Exam conditions. The clock runs, answers stay hidden and the paper is marked with that year's scheme when you submit.</p></div><div><h3>Practice</h3><p>No clock. Check each answer as you go and read the explanation straight away.</p></div><div><h3>Review</h3><p>Rate your confidence on every answer. Your report shows marks won or lost on guesses, your low-confidence topics, and answers you were sure of but got wrong.</p></div></div>
  <div class="secthead"><h2>Choose a paper</h2><span>Newest first · NAT numerical, MSQ multiple select, MCQ single answer</span></div>

  <div class="insights">
   <div><b>Patterns and numbers carry the most weight</b><p>They were the two largest groups in most years. In 2024–26 they averaged about 11 and 10 of the 57 questions.</p></div>
   <div><b>Everyday science is now a fixture</b><p>It has appeared every year since 2020 and rose to 11 questions in 2026: gears, light, shadows and how products work.</p></div>
   <div><b>Art, culture and design awareness are back</b><p>Absent from 2020 to 2024, they returned with 12 questions in 2025 and 9 in 2026. Crafts, monuments and Indian art need regular reading.</p></div>
   <div><b>Each section has its own mix</b><p>NAT is mostly counting, numbers and 3D. MCQ leans on patterns and transformations, about 8 of its 28 questions.</p></div>
  </div></div>
  <div class="secthead"><h2>New practice papers</h2><span>Five original papers in the 2026 format, built to this topic mix</span></div>
  <div class="years">${mcards}</div></main>`+footer();
  $('#mname').addEventListener('input',e=>{S.name=e.target.value.trim();save();});
}

function newAttempt(y,mode){
  const o=meta(y);
  S.att={y,mode,ans:{},mark:{},vis:{1:true},chk:{},cur:0,startAt:Date.now(),endAt:Date.now()+o.mins*60000,done:false};
  save();
}
async function openTest(){
  const a=S.att;S.view='test';S.palOpen=false;
  app.innerHTML=mast()+`<div class="loading">Loading ${ttl(a.y)}…</div>`;
  try{await getData(a.y);}catch(e){app.innerHTML=mast()+`<div class="wrap loading">The ${ttl(a.y)} paper did not load. Check your connection and try again.<br><br><button class="btn pri" data-act="resume">Try again</button></div>`;return;}
  renderTest();
}
function D(){return S.data[S.att.y];}
function curQ(){return D().qs[S.att.cur];}

function renderTest(){
  const a=S.att,d=D(),q=curQ(),o=meta(a.y);
  const sec=secOf(d,q.n);
  const practice=a.mode==='practice';
  app.innerHTML=`<div class="tbar"><div class="wrap">
    <button class="btn ghost exit" data-act="home" title="Leave and continue later. Your answers are saved${practice?'':'; the timer keeps running'}." aria-label="Exit to all papers">‹ Exit</button>
    <div class="ttl">${short(a.y)}<span class="md"> · ${practice?'Practice':'Timed mock'}</span><small>${esc(S.name||'Member')} · Part A · ${o.n} questions</small></div>
    <div class="tabs" role="group" aria-label="Sections">${d.sections.map(s=>`<button data-act="jump" data-n="${s.lo}" aria-pressed="${s===sec}">${s.type} <span class="mono">${s.lo}–${s.hi}</span></button>`).join('')}</div>
    ${practice?`<span class="timer" id="timer" title="Time spent">${clock(Date.now()-a.startAt)}</span>`:`<span class="timer" id="timer" title="Time left">${clock(a.endAt-Date.now())}</span>`}
    <button class="btn sec palbtn" data-act="pal">Questions</button>
    <button class="btn hot" data-act="ask-submit">${practice?'Finish':'Submit'}</button>
  </div></div>
  <main class="wrap tgrid"><section class="qpane" id="qpane"></section><aside class="pal" id="pal" aria-label="Question palette"></aside></main><div class="scrim" id="scrim" data-act="pal"></div><div id="modal"></div>`;
  renderQ();renderPal();tick();
}
function markLabel(s){
  if(s.type==='MSQ'&&s.partial) return `up to +${s.right} · ${fmt(s.wrong)}`;
  return `+${s.right} · ${s.wrong?fmt(s.wrong).replace('-','−'):'0'}`;
}
function renderQ(){
  const a=S.att,d=D(),q=curQ(),sec=secOf(d,q.n),val=a.ans[q.n];
  const practice=a.mode==='practice',checked=practice&&a.chk[q.n];
  let input='';
  if(q.acc.bonus&&checked){input='';}
  if(q.t==='NAT'){
    input=`<div class="lab">Type your answer or use the keypad. Numbers only.</div><div class="natrow"><input id="natin" inputmode="decimal" autocomplete="off" aria-label="Your numerical answer" value="${esc(val||'')}" ${checked?'disabled':''}>
    <div class="pad" ${checked?'hidden':''}>${['7','8','9','⌫','4','5','6','−','1','2','3','.'].map(k=>`<button data-act="key" data-k="${k}">${k}</button>`).join('')}<button class="wide" data-act="key" data-k="0">0</button><button class="wide" data-act="key" data-k="C">Clear</button></div></div>`;
  }else{
    const multi=q.t==='MSQ';
    const right=checked?(q.acc.sets||[''])[0]:'';
    input=`<div class="lab">${multi?'Select one or more options.':'Select one option.'} The options are in the question above.</div><div class="opts" role="${multi?'group':'radiogroup'}">${'ABCD'.split('').map(c=>{
      const on=val&&val.includes(c);
      let cls='opt'+(multi?' multi':'');
      if(checked){ if(!q.acc.bonus&&q.acc.sets.some(s=>s.includes(c))&&(right.includes(c))) cls+=' right'; else if(on) cls+=' wrong'; }
      return `<button class="${cls}" role="${multi?'checkbox':'radio'}" aria-checked="${!!on}" data-act="opt" data-c="${c}" ${checked?'disabled':''}><span class="box"></span>${c}</button>`;}).join('')}</div>`;
  }
  let fb='',exp='';
  if(checked){
    const r=evaluate(d,q,val);
    const map={right:['ok','Correct'],bonus:['ok','Full marks to everyone for this question'],part:['part','Partly correct'],wrong:['bad','Not correct'],blank:['blank','Not answered']};
    const [c,t]=map[r.st];
    fb=`<div class="fb ${c}"><div class="v">${t} <span class="mono">${sign(r.m)}</span></div><div class="k">Official answer: ${esc(officialAns(q))}${val?` · Your answer: ${esc(showAns(q,val))}`:''}</div></div>`;
    exp=explain(q);
  }
  const last=a.cur===d.qs.length-1;
  const acts=practice?
    `<button class="btn sec" data-act="prev" ${a.cur?'':'disabled'}>Previous</button>${checked?'':`<button class="btn sec" data-act="clear">Clear</button>`}<span class="sp"></span>${checked?(last?`<button class="btn hot" data-act="ask-submit">Finish and see results</button>`:`<button class="btn pri" data-act="next">Next question</button>`):`<button class="btn sec" data-act="reveal">Show answer</button><button class="btn pri" data-act="check">Check answer</button>`}`:
    `<button class="btn sec" data-act="prev" ${a.cur?'':'disabled'}>Previous</button><button class="btn sec" data-act="clear">Clear response</button><span class="sp"></span><button class="btn sec" data-act="marknext">${a.mark[q.n]?'Unmark':'Mark for review'} &amp; next</button><button class="btn ${last?'hot':'pri'}" data-act="savenext">${last?'Save &amp; finish':'Save &amp; next'}</button>`;
  a.conf=a.conf||{};
  const hasAns=val!=null&&val!=='';
  const cv=a.conf[q.n];
  const conf=`<div class="confrow" role="group" aria-label="How sure are you?"><span class="cl">How sure are you?<small>${hasAns?(cv?'You can change this any time before submitting.':'Pick one so your report can track it.'):'Answer first, then rate your confidence.'}</small></span>${CONF.map(([k,l,c])=>`<button class="cf" data-act="conf" data-v="${k}" aria-pressed="${cv===k}" ${(!hasAns||checked)?'disabled':''}><span class="d" style="background:${c}"></span>${l}</button>`).join('')}</div>`;
  $('#qpane').innerHTML=`<div class="qhead"><h2>Question ${q.n}</h2><span class="chip ${q.t.toLowerCase()}">${q.t}</span><span class="chip">${markLabel(sec)}</span>${a.mark[q.n]&&!practice?'<span class="chip" style="color:var(--mark)">Marked for review</span>':''}</div>
  ${qsheet(q,a.y,false)}
  <div class="ansbox">${input}${q.acc.bonus&&checked?'':conf}${fb}</div>${exp}<div class="qacts">${acts}</div>`;
  const ni=$('#natin');
  if(ni) ni.addEventListener('input',e=>{const v=e.target.value.replace(/[^0-9.\-−]/g,'');if(v!==e.target.value)e.target.value=v;setAns(v);document.querySelectorAll('.cf').forEach(b=>b.disabled=!v);const h=document.querySelector('.confrow small');if(h)h.textContent=v?'Pick one so your report can track it.':'Answer first, then rate your confidence.';});
}
function qsheet(q,y,lazy){
  if(q.img) return `<div class="sheet"><img ${lazy?'loading="lazy" ':''}src="${q.img}" width="${q.w}" height="${q.h}" style="width:${Math.round(q.w*0.7)}px" alt="${ttl(y)} question ${q.n} as printed in the official paper"></div>`;
  let h=`<div class="sheet orig"><p class="stem">${q.stem}</p>`;
  if(q.fig) h+=`<div class="ofig">${q.fig}</div>`;
  if(q.opts) h+=`<div class="olist${q.layout==='grid'?' og':''}">${q.opts.map((o,i)=>`<div class="oi"><b>${'ABCD'[i]}</b><div>${o}</div></div>`).join('')}</div>`;
  return h+`</div>`;
}
function explain(q){
  let h=`<div class="exp"><div class="h">How to solve it</div>`;
  if(q.steps.length) h+=`<ol>${q.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>`;
  if(q.note) h+=`<p>${q.note}</p>`;
  if(q.svg) h+=`<figure class="viz">${q.svg}</figure>`;
  if(q.trap) h+=`<div class="trap"><b>Common mistake</b>${q.trap}</div>`;
  return h+`</div>`;
}
function status(n){
  const a=S.att,has=a.ans[n]!=null&&a.ans[n]!=='';
  if(a.mode==='practice'){
    if(!a.chk[n]) return a.vis[n]?(has?'ans':'vis'):'';
    const r=evaluate(D(),D().qs.find(q=>q.n===n),a.ans[n]);
    return r.st==='right'||r.st==='bonus'?'pr-ok':r.st==='part'?'pr-part':r.st==='blank'?'vis':'pr-bad';
  }
  if(a.mark[n]) return has?'mk mkans':'mk';
  if(has) return 'ans';
  return a.vis[n]?'vis':'';
}
function renderPal(){
  const a=S.att,d=D(),cur=curQ().n,practice=a.mode==='practice';
  const c={ans:0,vis:0,mk:0,nv:0,ok:0,bad:0,part:0};
  for(const q of d.qs){const s=status(q.n);
    if(practice){if(s==='pr-ok')c.ok++;else if(s==='pr-bad')c.bad++;else if(s==='pr-part')c.part++;else c.nv++;}
    else if(s.startsWith('mk'))c.mk++;else if(s==='ans')c.ans++;else if(s==='vis')c.vis++;else c.nv++;}
  const counts=practice?
    `<span><i class="sw ans"></i>Correct <b>${c.ok}</b></span><span><i class="sw bad"></i>Wrong <b>${c.bad}</b></span><span><i class="sw part"></i>Partial <b>${c.part}</b></span><span><i class="sw"></i>Not checked <b>${c.nv}</b></span>`:
    `<span><i class="sw ans"></i>Answered <b>${c.ans}</b></span><span><i class="sw vis"></i>Not answered <b>${c.vis}</b></span><span><i class="sw mk"></i>Marked <b>${c.mk}</b></span><span><i class="sw"></i>Not visited <b>${c.nv}</b></span>`;
  $('#pal').innerHTML=`<h3>Question palette</h3><div class="counts">${counts}</div>${d.sections.map(s=>`<div class="psec"><div class="ph">${s.type} · Q${s.lo}–${s.hi}</div><div class="pgrid">${d.qs.filter(q=>q.n>=s.lo&&q.n<=s.hi).map(q=>`<button class="pq ${status(q.n)}${q.n===cur?' cur':''}" data-act="jump" data-n="${q.n}" aria-label="Question ${q.n}">${q.n}</button>`).join('')}</div></div>`).join('')}<button class="btn hot" data-act="ask-submit">${practice?'Finish and see results':'Submit test'}</button>`;
  $('#pal').classList.toggle('open',S.palOpen);$('#scrim').classList.toggle('open',S.palOpen);
}
function setAns(v){const a=S.att,q=curQ();a.conf=a.conf||{};if(v===''||v==null){delete a.ans[q.n];delete a.conf[q.n];}else a.ans[q.n]=v;save();renderPal();}
function go(i){const a=S.att,d=D();a.cur=Math.max(0,Math.min(d.qs.length-1,i));a.vis[d.qs[a.cur].n]=true;S.palOpen=false;save();
  const sec=secOf(d,curQ().n);document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.n===sec.lo)));
  renderQ();renderPal();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});}

let timerId=null;
function tick(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const a=S.att;if(S.view!=='test'||!a){clearInterval(timerId);return;}
    const el=$('#timer');if(!el)return;
    if(a.mode==='practice'){el.textContent=clock(Date.now()-a.startAt);return;}
    const left=a.endAt-Date.now();el.textContent=clock(left);el.classList.toggle('low',left<5*60000);
    if(left<=0){clearInterval(timerId);finish(true);}
  },1000);
}
function askSubmit(){
  const a=S.att,d=D();
  const answered=d.qs.filter(q=>a.ans[q.n]!=null&&a.ans[q.n]!=='').length;
  const practice=a.mode==='practice';
  const marked=practice?0:Object.keys(a.mark).length;
  const firstOpen=d.qs.find(q=>practice?!a.chk[q.n]:(a.ans[q.n]==null||a.ans[q.n]===''));
  a.conf=a.conf||{};
  const unrated=d.qs.filter(q=>a.ans[q.n]!=null&&a.ans[q.n]!==''&&!a.conf[q.n]);
  const left=practice?'':`<p>Time left: <b class="mono">${clock(a.endAt-Date.now())}</b></p>`;
  $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card"><h3 id="mt">${practice?'Finish practice?':'Submit your test?'}</h3><p>You have answered <b>${answered}</b> of ${d.qs.length} questions${marked?`, with <b>${marked}</b> marked for review`:''}.</p>${left}${unrated.length?`<p class="need"><b>${unrated.length}</b> answered question${unrated.length>1?'s have':' has'} no confidence level and will be left out of the confidence report.</p>`:''}<p>${practice?'Questions you did not check count as not answered.':'You cannot change answers after submitting.'}</p><div class="row">${firstOpen?`<button class="btn sec" data-act="jumpopen" data-n="${firstOpen.n}">Go to Q${firstOpen.n} (${practice?'not checked':'unanswered'})</button>`:''}${unrated.length?`<button class="btn sec" data-act="jumpopen" data-n="${unrated[0].n}">Rate Q${unrated[0].n}</button>`:''}<button class="btn sec" data-act="close-modal">Keep going</button><button class="btn hot" data-act="submit">${practice?'Finish':'Submit'}</button></div></div></div>`;
}
function finish(auto){
  const a=S.att,d=D();
  const ans=a.mode==='practice'?Object.fromEntries(Object.entries(a.ans).filter(([n])=>a.chk[n])):a.ans;
  const r=results(d,ans);
  a.done=true;a.finishedAt=Math.min(Date.now(),a.mode==='mock'?a.endAt:Date.now());a.auto=!!auto;a.scored=ans;a.cscored=Object.fromEntries(Object.entries(a.conf||{}).filter(([n])=>ans[n]!=null&&ans[n]!==''));
  sendResult(a,d,r);
  if(a.mode==='mock'){const b=S.best[a.y];if(!b||r.total>b.score)S.best[a.y]={score:r.total,at:Date.now()};}
  save();clearInterval(timerId);
  const rk=d.qs.some(q=>a.cscored[q.n]==='H'&&(r.per[q.n].st==='wrong'||r.per[q.n].st==='part'));
  S.rfilter=rk?'risk':r.secs.some(s=>s.wrong+s.part)?'wrong':'all';
  renderResult();
}
/* Optional: post each finished attempt to the portal (set EA_CONFIG.resultsEndpoint). */
function sendResult(a,d,r){
  if(!CFG.resultsEndpoint) return;
  const C=a.cscored||{},per={};
  for(const q of d.qs){const x=r.per[q.n];per[q.n]={type:q.t,topic:q.cat||null,answer:a.scored[q.n]??null,official:q.disp,status:x.st,marks:x.m,confidence:C[q.n]||null};}
  const body={memberId:CFG.memberId||null,name:S.name||null,paper:String(a.y),paperTitle:ttl(a.y),mode:a.mode,score:Math.round(r.total*100)/100,max:meta(a.y).max,
    sections:r.secs.map(s=>({type:s.type,score:Math.round(s.score*100)/100,max:s.max,right:s.right,partial:s.part,wrong:s.wrong,blank:s.blank})),
    startedAt:new Date(a.startAt).toISOString(),finishedAt:new Date(a.finishedAt).toISOString(),autoSubmitted:!!a.auto,questions:per};
  a.sync='sending';
  fetch(CFG.resultsEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',keepalive:true,body:JSON.stringify(body)})
    .then(res=>{a.sync=res.ok?'saved':'failed';}).catch(()=>{a.sync='failed';})
    .finally(()=>{save();const el=document.getElementById('sync');if(el)el.textContent=syncText(a);});
}
function syncText(a){return a.sync==='saved'?' · saved to your member account':a.sync==='failed'?' · could not save to your account (kept on this device)':a.sync==='sending'?' · saving…':'';}
function renderResult(){
  S.view='result';
  const a=S.att,d=D(),o=meta(a.y),r=results(d,a.scored||{});
  const tot=r.secs.reduce((t,s)=>({right:t.right+s.right,part:t.part+s.part,wrong:t.wrong+s.wrong,blank:t.blank+s.blank}),{right:0,part:0,wrong:0,blank:0});
  const attempted=tot.right+tot.part+tot.wrong;
  const acc=attempted?Math.round((tot.right)/attempted*100):0;
  const used=clock(a.finishedAt-a.startAt);
  const secCards=r.secs.map(s=>{const n=s.hi-s.lo+1;const W=x=>(x/n*100).toFixed(2)+'%';
    return `<div class="rsec"><div class="eyebrow">${s.type} · Q${s.lo}–${s.hi}</div><div class="n" style="margin-top:6px">${fmt(s.score)} <small>/ ${s.max}</small></div>
    <div class="stack" aria-hidden="true"><i style="width:${W(s.right)};background:var(--ok)"></i><i style="width:${W(s.part)};background:var(--part)"></i><i style="width:${W(s.wrong)};background:var(--bad)"></i></div>
    <div class="legend"><span><i class="sw ans"></i>${s.right} right</span>${s.part?`<span><i class="sw part"></i>${s.part} partial</span>`:''}<span><i class="sw bad"></i>${s.wrong} wrong</span><span><i class="sw"></i>${s.blank} blank</span></div></div>`;}).join('');
  const C=a.cscored||{};
  const riskN=d.qs.filter(q=>C[q.n]==='H'&&(r.per[q.n].st==='wrong'||r.per[q.n].st==='part')).length;
  const F=[['all','All',d.qs.length],['risk','Sure but wrong',riskN],['wrong','Wrong',tot.wrong],['part','Partial',tot.part],['blank','Not answered',tot.blank],['right','Correct',tot.right]].filter(f=>(f[0]!=='part'&&f[0]!=='risk')||f[2]);
  app.innerHTML=mast()+`<main class="wrap">
   <section class="rhero"><div><div class="eyebrow">Score card · ${ttl(a.y)} · Part A · ${a.mode==='mock'?'Timed mock':'Practice'}</div>
   <div class="score" style="margin-top:10px">${fmt(r.total)} <small>/ ${o.max}</small></div>
   <div class="rmeta">${esc(S.name||'Member')} · ${attempted} attempted · ${acc}% fully correct · time used <span class="mono">${used}</span>${a.auto?' · submitted when time ran out':''}<span id="sync">${syncText(a)}</span></div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-act="home">All papers</button><button class="btn pri" data-act="start" data-y="${a.y}" data-mode="${a.mode}">Try again</button></div></section>
   <div class="rsecs">${secCards}</div>
   ${confPanel(d,r)}
   ${topicPanel(d,r)}
   <div class="secthead"><h2>Review answers</h2><span>Open any question to see the official answer and how to solve it</span></div>
   <div class="filters" role="group" aria-label="Filter questions">${F.map(f=>`<button data-act="rf" data-f="${f[0]}" aria-pressed="${S.rfilter===f[0]}">${f[1]} <span class="mono">${f[2]}</span></button>`).join('')}</div>
   <div class="rlist" id="rlist"></div></main>`+footer();
  renderReview(r);
}
function confPanel(d,r){
  const a=S.att,ans=a.scored||{},C=a.cscored||{};
  const answered=d.qs.filter(q=>ans[q.n]!=null&&ans[q.n]!=='');
  if(!answered.length) return '';
  const rated=answered.filter(q=>C[q.n]);
  const st={};for(const [k] of CONF) st[k]={n:0,right:0,part:0,wrong:0,gain:0,loss:0,qs:[]};
  for(const q of rated){const x=r.per[q.n],s=st[C[q.n]];s.n++;s.qs.push(q);
    if(x.st==='right'||x.st==='bonus')s.right++;else if(x.st==='part')s.part++;else s.wrong++;
    if(x.m>0)s.gain+=x.m;else s.loss+=x.m;}
  const pct=s=>s.n?Math.round(s.right/s.n*100):null;
  if(!rated.length) return `<section class="cpanel"><h3>Confidence analysis</h3><p class="lead">No confidence levels were recorded in this attempt. Next time, tap Guess, Low, Medium or High after each answer to see where your marks come from and where you are at risk.</p></section>`;
  const tiles=[...CONF].reverse().map(([k,l,c])=>{const s=st[k],p=pct(s);const net=s.gain+s.loss;
    return `<div class="ctile"><div class="lv"><span class="d" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:6px"></span>${l}</div><div class="big">${s.n} <small>answer${s.n===1?'':'s'}</small></div>
    <div class="sub">${s.n?`${p}% fully right · net <b class="mono" style="color:${net>0?'var(--ok)':net<0?'var(--bad)':'var(--muted)'}">${sign(net)}</b>`:'Not used'}</div>
    <div class="acc"><i style="width:${p||0}%;background:${c}"></i></div></div>`;}).join('');
  // risk: high confidence but wrong or partly wrong
  const risk=st.H.qs.filter(q=>r.per[q.n].st==='wrong'||r.per[q.n].st==='part');
  const riskLost=risk.reduce((t,q)=>t+(secOf(d,q.n).right-r.per[q.n].m),0);
  const rt={};risk.forEach(q=>{if(q.cat)rt[q.cat]=(rt[q.cat]||0)+1;});
  const rtop=Object.entries(rt).sort((x,y)=>y[1]-x[1]).slice(0,2).map(([k,v])=>`${CATS[k]} (${v})`);
  const riskBox=`<div class="cbox risk"><div class="t">Sure but wrong · at risk</div><div class="n">${risk.length}</div>
    <p>${risk.length?`High-confidence answers that were wrong${risk.some(q=>r.per[q.n].st==='part')?' or only partly right':''}. They cost you ${fmt(riskLost)} marks compared with getting them right. Being sure and wrong usually means a concept has been learnt incorrectly, so these come first in revision.${rtop.length?` Most are in ${rtop.join(' and ')}.`:''}`:(st.H.n?`All ${st.H.n} high-confidence answers were right. Your sense of what you know is reliable.`:'You did not mark any answer as High.')}</p>
    ${risk.length?`<div class="qchips">${risk.map(q=>`<button data-act="riskjump" data-n="${q.n}" title="${q.cat?CATS[q.cat]:''}">Q${q.n}</button>`).join('')}</div>`:''}</div>`;
  // guesses
  const g=st.G,gnet=g.gain+g.loss;
  const guessBox=`<div class="cbox guess"><div class="t">Guesses</div><div class="n">${g.n?sign(gnet):'–'}</div>
    <p>${g.n?`${g.n} guess${g.n>1?'es':''}: ${g.right} right${g.part?`, ${g.part} partly right`:''}, ${g.wrong} wrong. Gained <b class="mono">${sign(g.gain)}</b>, lost <b class="mono">${fmt(g.loss).replace('-','−')}</b>. `+(gnet>0?'Guessing added marks overall. Keep guessing only after ruling out at least one option, and avoid blind guesses in MSQ, where one wrong tick gives −1.':gnet<0?'Guessing cost you marks overall. Guess only when you can rule out at least two options, and leave MSQ blank rather than guess.':'Guessing broke even.'):'You did not mark any answer as a guess.'}</p></div>`;
  // low zone
  const lowqs=[...st.L.qs,...st.G.qs];
  const lt={};lowqs.forEach(q=>{if(q.cat)lt[q.cat]=(lt[q.cat]||0)+1;});
  const ltop=Object.entries(lt).sort((x,y)=>y[1]-x[1]).filter(x=>x[1]>=2).slice(0,3).map(([k,v])=>`${CATS[k]} (${v})`);
  const l=st.L,lnet=l.gain+l.loss;
  const lowBox=`<div class="cbox low"><div class="t">Low-confidence zones</div><div class="n">${lowqs.length}</div>
    <p>${lowqs.length?`Answers marked Low or Guess. ${l.n?`Low answers were ${pct(l)}% right (net ${sign(lnet)}). `:''}${ltop.length?`They cluster in <b>${ltop.join(', ')}</b>. These topics need practice to turn doubt into certainty.`:'They are spread across topics, with no single weak area.'}`:'No answers were marked Low or Guess.'}</p></div>`;
  // calibration
  const pH=pct(st.H),pM=pct(st.M),pL=pct(st.L),pG=pct(st.G);
  const seq=[['High',pH],['Medium',pM],['Low',pL],['Guess',pG]].filter(x=>x[1]!==null);
  let calib='';
  if(seq.length>=2){
    const ordered=seq.every((x,i)=>i===0||seq[i-1][1]>=x[1]);
    calib=`<div class="calib"><b>Is your confidence accurate?</b> Fully right by level: ${seq.map(x=>`${x[0]} ${x[1]}%`).join(' · ')}.<p class="note">${ordered?'Your accuracy rises with your confidence, which is what we want to see.':'Your accuracy does not rise steadily with confidence. Some answers you felt unsure about were right and some you felt sure about were wrong, so trust a method you can explain rather than a gut feeling.'}</p></div>`;
  }
  const unr=answered.length-rated.length;
  return `<section class="cpanel"><h3>Confidence analysis</h3><p class="lead">Based on the confidence you chose for ${rated.length} of your ${answered.length} answers${unr?` (${unr} without a rating ${unr===1?'is':'are'} left out)`:''}. "Fully right" means full marks for that question.</p>
  <div class="ctiles">${tiles}</div><div class="cgrid">${riskBox}${guessBox}${lowBox}</div>${calib}</section>`;
}
function topicPanel(d,r){
  if(!d.qs.some(q=>q.cat)) return '';
  const T={};
  for(const q of d.qs){if(!q.cat)continue;const t=T[q.cat]||(T[q.cat]={n:0,right:0,score:0,max:0});t.n++;t.max+=secOf(d,q.n).right;const x=r.per[q.n];t.score+=x.m;if(x.st==='right'||x.st==='bonus')t.right++;}
  const rows=Object.entries(T).map(([k,t])=>({k,...t,p:t.max?Math.max(0,t.score)/t.max:0})).sort((a,b)=>a.p-b.p);
  const weak=rows.filter(x=>x.n>=3).slice(0,2).map(x=>CATS[x.k]);
  const col=p=>p>=0.6?'var(--ok)':p>=0.35?'var(--part)':'var(--bad)';
  return `<section class="topics"><h3>Score by topic</h3><p class="focus">${weak.length?`Focus next on <b>${weak.join('</b> and <b>')}</b>.`:''} Weakest topics are listed first.</p>
  ${rows.map(x=>`<div class="trow"><span>${CATS[x.k]} <span class="mono" style="color:var(--muted);font-size:12px">· ${x.right}/${x.n} right</span></span><span class="tb"><i style="width:${(x.p*100).toFixed(1)}%;background:${col(x.p)}"></i></span><span class="tv">${fmt(x.score)} / ${x.max}</span></div>`).join('')}</section>`;
}
function renderReview(r){
  const a=S.att,d=D();r=r||results(d,a.scored||{});
  const ans=a.scored||{};
  const f=S.rfilter;
  const C=a.cscored||{};
  const isRisk=q=>C[q.n]==='H'&&(r.per[q.n].st==='wrong'||r.per[q.n].st==='part');
  const list=d.qs.filter(q=>{const s=r.per[q.n].st;return f==='all'||(f==='risk'?isRisk(q):f==='right'?(s==='right'||s==='bonus'):s===f);});
  $('#rlist').innerHTML=list.length?list.map(q=>{const x=r.per[q.n];const cls=x.m>0?(x.st==='part'?'part':'pos'):x.m<0?'neg':'zero';
    return `<details class="ritem${isRisk(q)?' risk':''}" id="rq${q.n}"><summary><span class="qn">Q${q.n}${C[q.n]?`<span class="cchip ${C[q.n]}" title="Your confidence">${CNAME[C[q.n]]}</span>`:''}</span><span class="chip ${q.t.toLowerCase()} ty">${q.t}</span><span class="val"><span class="lbl">You</span>${esc(showAns(q,ans[q.n]))}</span><span class="val"><span class="lbl">Official</span>${esc(officialAns(q))}</span><span class="mk ${cls}">${x.st==='blank'?'0':sign(x.m)}</span></summary>
    <div class="body">${q.cat?`<p class="rcat">${CATS[q.cat]}</p>`:''}${qsheet(q,a.y,true)}${explain(q)}</div></details>`;}).join(''):`<div class="empty">No questions in this group.</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,a=S.att;
  switch(act){
    case 'home': if(S.view==='test'){S.view='home';clearInterval(timerId);} renderHome();window.scrollTo(0,0);break;
    case 'start': newAttempt(t.dataset.y,t.dataset.mode);await openTest();window.scrollTo(0,0);break;
    case 'resume': await openTest();break;
    case 'discard': S.att=null;save();renderHome();break;
    case 'jump': go(D().qs.findIndex(q=>q.n===+t.dataset.n));break;
    case 'prev': go(a.cur-1);break;
    case 'next': go(a.cur+1);break;
    case 'savenext': if(a.cur<D().qs.length-1)go(a.cur+1);else{renderPal();askSubmit();}break;
    case 'marknext': {const n=curQ().n;if(a.mark[n])delete a.mark[n];else a.mark[n]=true;save();if(a.cur<D().qs.length-1)go(a.cur+1);else{renderQ();renderPal();askSubmit();}break;}
    case 'clear': setAns('');renderQ();break;
    case 'conf': {a.conf=a.conf||{};const n=curQ().n;if(a.conf[n]===t.dataset.v)delete a.conf[n];else a.conf[n]=t.dataset.v;save();document.querySelectorAll('.cf').forEach(b=>b.setAttribute('aria-pressed',String(a.conf[n]===b.dataset.v)));break;}
    case 'riskjump': {const q=document.querySelector(`#rq${t.dataset.n}`);if(q){q.open=true;q.scrollIntoView({behavior:'smooth',block:'start'});}break;}
    case 'opt': {const q=curQ(),c=t.dataset.c;let v=a.ans[q.n]||'';
      if(q.t==='MCQ') v=v===c?'':c; else v=v.includes(c)?v.replace(c,''):[...v+c].sort().join('');
      setAns(v);renderQ();break;}
    case 'key': {const k=t.dataset.k,inp=$('#natin');let v=inp.value;
      if(k==='⌫')v=v.slice(0,-1);else if(k==='C')v='';else if(k==='−'){v=v.startsWith('-')?v.slice(1):'-'+v;}else if(k==='.'){if(!v.includes('.'))v+=(v===''||v==='-'?'0.':'.');}else v+=k;
      inp.value=v;setAns(v);document.querySelectorAll('.cf').forEach(b=>b.disabled=!v);{const h=document.querySelector('.confrow small');if(h)h.textContent=v?'Pick one so your report can track it.':'Answer first, then rate your confidence.';}break;}
    case 'check': a.chk[curQ().n]=true;save();renderQ();renderPal();break;
    case 'reveal': a.chk[curQ().n]=true;save();renderQ();renderPal();break;
    case 'pal': S.palOpen=!S.palOpen;renderPal();break;
    case 'ask-submit': askSubmit();break;
    case 'jumpopen': $('#modal').innerHTML='';go(D().qs.findIndex(q=>q.n===+t.dataset.n));break;
    case 'close-modal': $('#modal').innerHTML='';break;
    case 'submit': $('#modal').innerHTML='';finish(false);window.scrollTo(0,0);break;
    case 'rf': S.rfilter=t.dataset.f;document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));renderReview();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal')&&$('#modal').innerHTML){$('#modal').innerHTML='';}else if(S.palOpen){S.palOpen=false;renderPal();}}
});

load();
if(S.att&&S.att.done&&S.att.scored){ /* last result stays available via Try again; start at home */ }
if(S.att&&!S.att.done&&S.att.mode==='mock'&&S.att.endAt<Date.now()){
  // time ran out while away: score it on next open
  getData(S.att.y).then(()=>{finish(true);}).catch(()=>renderHome());
  renderHome();
}else renderHome();
})();
</script>
