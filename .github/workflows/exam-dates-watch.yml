name: Exam dates daily watch

# Every day: read the official exam pages listed in college-predictor/app/data/exam_sources.json, compare with the
# previous run, and check our own /exam-schedule data for rows that are due for confirmation.
# It never edits the site. If anything needs a human look it opens (or updates) ONE issue labelled "exam-schedule";
# apply the real dates in college-predictor/app/services/exam_page.py, push, and Render redeploys the page.
# No secrets needed. Previous-run state is kept in the Actions cache (a lost cache just re-baselines).

on:
  schedule:
    - cron: '30 1 * * *'        # 01:30 UTC = 07:00 IST every day
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: exam-dates-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: college-predictor/requirements.txt

      - name: Install dependencies
        working-directory: college-predictor
        run: pip install -r requirements.txt requests

      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: college-predictor/.watch
          key: exam-watch-state-${{ github.run_id }}
          restore-keys: exam-watch-state-

      - name: Run the watcher
        id: watch
        working-directory: college-predictor
        env:
          DATABASE_URL: sqlite:///watch.db
          SECRET_KEY: watch
        run: python scripts/exam_watch.py --state .watch/state.json --report .watch/report.md

      - name: Save snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: college-predictor/.watch
          key: exam-watch-state-${{ github.run_id }}

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-watch-report
          path: college-predictor/.watch/report.md
          retention-days: 14

      - name: Open or update the review issue
        if: steps.watch.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create exam-schedule --color 0E3A8A --description "Exam dates need review" 2>/dev/null || true
          n=$(gh issue list --label exam-schedule --state open --json number --jq '.[0].number')
          title="Exam schedule review — $(date -u +%d\ %b\ %Y)"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file college-predictor/.watch/report.md
          else
            gh issue create --title "$title" --label exam-schedule --body-file college-predictor/.watch/report.md
          fi
